<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Politique de Confidentialité - TicketStay</title>
  
  <!-- Polices Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Parser Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #181a24;
      --accent-color: #8b5cf6;
      --accent-hover: #7c3aed;
      --discord-color: #5865F2;
      --text-main: #ffffff;
      --text-muted: #c5c6c7;
      --border-color: #374151;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAVBAR */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 8%;
      background: rgba(11, 12, 16, 0.95);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      list-style: none;
      align-items: center;
      gap: 30px;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--text-main);
    }

    .btn-nav {
      background-color: var(--accent-color);
      color: white !important;
      padding: 10px 20px;
      border-radius: 30px;
    }

    /* CONTENEUR ET DESIGN DE LA PAGE CONFIDENTIALITÉ */
    .container {
      max-width: 850px;
      width: 90%;
      margin: 50px auto;
      flex: 1;
    }

    .legal-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 45px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* TYPOGRAPHIE DYNAMIQUE DU TEXTE MARKDOWN */
    .legal-card h1 {
      font-size: 32px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }

    .legal-card h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent-color);
      margin-top: 35px;
      margin-bottom: 15px;
    }

    .legal-card h3 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
      margin-top: 25px;
      margin-bottom: 10px;
    }

    .legal-card p {
      color: var(--text-muted);
      font-size: 16px;
      margin-bottom: 18px;
      line-height: 1.7;
    }

    .legal-card ul, .legal-card ol {
      color: var(--text-muted);
      margin-bottom: 20px;
      padding-left: 25px;
    }

    .legal-card li {
      margin-bottom: 8px;
    }

    .legal-card a {
      color: var(--accent-color);
      text-decoration: underline;
    }

    .legal-card hr {
      border: 0;
      height: 1px;
      background: var(--border-color);
      margin: 30px 0;
    }

    .legal-card strong {
      color: var(--text-main);
    }

    /* FOOTER */
    .footer {
      padding: 40px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-color);
      font-size: 14px;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 20px;
      background: var(--bg-color);
    }

    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      margin-left: 20px;
    }

    .footer-links a:hover {
      color: white;
    }

    @media (max-width: 768px) {
      .legal-card { padding: 25px; }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>

  <!-- BARRE DE NAVIGATION -->
  <nav class="navbar">
    <a href="index.html" class="logo">
      <span class="logo-icon">🎟️</span> TicketStay
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Accueil</a></li>
      <li><a href="https://discord.gg/tpFYkftsW3" target="_blank">💬 Discord</a></li>
      <li><a href="privacy.html" class="active">Confidentialité</a></li>
      <li><a href="https://apps.apple.com/ca/app/ticketstay/id6796148236" target="_blank" class="btn-nav">Obtenir l'application</a></li>
    </ul>
  </nav>

  <!-- CONTENEUR DU TEXTE DYNAMIQUE -->
  <main class="container">
    <div id="privacy-content" class="legal-card">
      <p style="color: var(--text-muted); text-align: center;">Chargement de la politique de confidentialité...</p>
    </div>
  </main>

  <!-- PIED DE PAGE -->
  <footer class="footer">
    <p>© 2026 TicketStay. Tous droits réservés.</p>
    <div class="footer-links">
      <a href="index.html">Accueil</a>
      <a href="https://discord.gg/tpFYkftsW3" target="_blank">Discord</a>
      <a href="https://apps.apple.com/ca/app/ticketstay/id6796148236" target="_blank">App Store</a>
    </div>
  </footer>

  <!-- SCRIPT LECTEUR DE PRIVACY.MD -->
  <script>
    async function loadPrivacyPolicy() {
      try {
        const response = await fetch('privacy.md?v=' + new Date().getTime());
        if (!response.ok) throw new Error('Fichier introuvable');
        const text = await response.text();
        
        // Formate et injecte le Markdown dans le conteneur stylisé
        document.getElementById('privacy-content').innerHTML = marked.parse(text);
      } catch (error) {
        document.getElementById('privacy-content').innerHTML = `
          <h1>Politique de Confidentialité</h1>
          <p>Le fichier <code>privacy.md</code> est introuvable à la racine de votre projet.</p>
          <p>Assurez-vous d'avoir créé un fichier nommé <strong>privacy.md</strong> à côté de privacy.html sur GitHub.</p>
        `;
      }
    }

    loadPrivacyPolicy();
  </script>

</body>
</html>
