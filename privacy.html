  <!-- Script pour convertir automatiquement le Markdown en HTML -->

</head>
<body>

  <!-- BARRE DE NAVIGATION -->

    <a href="index.html" class="logo">
      <span class="logo-icon">🎟️</span> TicketStay
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Accueil</a></li>
      <li><a href="[https://discord.gg/tpFYkftsW3](https://discord.gg/tpFYkftsW3)" target="_blank" class="discord-link">💬 Discord</a></li>

    </ul>
  </nav>

  <!-- CONTENU CHARGÉ DEPUIS privacy.md -->
  <main class="container">
    <div id="privacy-content" class="legal-page">
      <p>Chargement de la politique de confidentialité...</p>
    </div>
  </main>

  <!-- PIED DE PAGE -->

    <p>© 2026 TicketStay. Tous droits réservés.</p>
    <div class="footer-links">
      <a href="index.html">Accueil</a>

    </div>
  </footer>

  <!-- SCRIPT DE CHARGEMENT AUTOMATIQUE -->
  <script>
    async function loadPrivacyPolicy() {
      try {
        const response = await fetch('privacy.md');
        if (!response.ok) {
          throw new Error('Fichier introuvable');
        }
        const text = await response.text();
        document.getElementById('privacy-content').innerHTML = marked.parse(text);
      } catch (error) {
        document.getElementById('privacy-content').innerHTML = `
          <h1>Politique de Confidentialité</h1>
          <p>Impossible de charger le fichier privacy.md pour le moment.</p>
        `;
      }
    }
    loadPrivacyPolicy();
  </script>

</body>
</html>
